name: CASHNET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashnet_test
          POSTGRES_USER: cashnet
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashnet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint --if-present

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -r --if-present run test
        env:
          DATABASE_URL: postgres://cashnet:test_password@localhost:5432/cashnet_test

      - name: Build
        run: pnpm --filter @workspace/api-server run build

      - name: Verify migrations
        run: |
          for f in database/migrations/*.sql; do
            echo "Validating: $f"
            psql "$DATABASE_URL" -f "$f"
          done
        env:
          DATABASE_URL: postgres://cashnet:test_password@localhost:5432/cashnet_test

      - name: Migration idempotency
        run: |
          for f in database/migrations/*.sql; do
            echo "Idempotency check: $f"
            psql "$DATABASE_URL" -f "$f"
          done
        env:
          DATABASE_URL: postgres://cashnet:test_password@localhost:5432/cashnet_test

      - name: Git check
        run: git diff --check

  security:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: No hardcoded secrets
        run: |
          ! grep -rnI --include='*.ts' --include='*.js' --include='*.json' \
            -E '(api[_-]?key|secret|password|token)\s*[:=]\s*"[^"]{10,}"' \
            artifacts/ lib/ scripts/ || true

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: docker build -t cashnet:ci .

      - name: Container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cashnet:ci
          format: table
          severity: CRITICAL,HIGH
        continue-on-error: true
